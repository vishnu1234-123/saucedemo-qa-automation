trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

jobs:
  - job: Test
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      matrix:
        chromium:
          browser: 'chromium'
        firefox:
          browser: 'firefox'
        webkit:
          browser: 'webkit'

    steps:
      - task: UsePythonVersion@0
        displayName: 'Use Python 3.13'
        inputs:
          versionSpec: '3.13'
      
      - script: pip install -r requirements.txt
        displayName: 'Install dependencies'

      - script: python -m playwright install --with-deps $(browser)
        displayName: 'Install Playwright browser: $(browser)'
      
      - script: >
          pytest --browser $(browser)
          --junitxml=test-results/results-$(browser).xml
          --tracing retain-on-failure
          --output test-results/artifacts-$(browser)
          -v
        displayName: 'Run Pytest on $(browser)'
      - script: >
          python tools/sync_results_to_azure.py
          --junit "test-results/results-chromium.xml"
          --org $(System.CollectionUri)
          --project $(System.TeamProject)
          --plan 36
          --run-name "Pipeline $(Build.BuildNumber)"
        displayName: 'Sync results to Azure Test Plans'
        condition: and(succeededOrFailed(), eq(variables['browser'], 'chromium'))
        env:
          ADO_PAT: $(ADO_PAT)
      - task: PublishTestResults@2
        displayName: 'Publish Test results'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: 'test-results/results-$(browser).xml'
          testRunTitle: 'Sauce Demo - $(browser)'
          mergeTestResults: false

      - task: PublishPipelineArtifact@1
        displayName: 'Publish traces on failure'
        condition: failed()
        inputs:
          targetPath: 'test-results'
          artifact: 'test-results-$(browser)'