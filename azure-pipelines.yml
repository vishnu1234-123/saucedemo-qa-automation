trigger:
  branches:
    include:  
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    chromium:
      browser: chromium
    firefox:
      browser: firefox
    webkit:
      browser: webkit

steps:
  - task: UsePythonVersion@0
    displayName: Use Python 3.13
    inputs:
      versionSpec: "3.13"
  
  - script: pip install -r requirements.txt
    displayName: Install dependencies

  - script: pip install --with-deps $(browser)
    displayName: Install $(browser)
  
  - script: >
      pytest --browser $(browser)
      --junitxml=test-results/results-$(browser).xml
      --tracing retain-on-failure
      --output test-results/artifacts-$(browser)
      -v
  - task: PublishTestResults@2
    displayName: Publish Test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: Junit
      testResultsFiles: test-results/results-$(browser).xml
      testRunTitle: Sauce Demo -$(browser)
      mergeTestResults: false

  - task: PublishPipelineArtifact@1
    displayName: Publish traces on failure
    condition: failed()
    inputs:
      targetPath: test-results
      artifact: test-results-$(browser)